<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamin Toth — Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap">
  <link rel="stylesheet" href="../css/background.css">
  <link rel="stylesheet" href="../css/work.css">
  <link rel="stylesheet" href="../css/resume.css">
  <link rel="stylesheet" href="../css/contact.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="margin-rule" aria-hidden="true"></div>

  <div class="wrap">
    <header class="top">
      <div>
        <div class="byline"><span class="first">Benjamin</span> <span class="last">Toth</span></div>
        <div class="wordmark"><a href="../" style="color:inherit;text-decoration:none;">portfolio.</a></div>
        <div class="work-tabs" id="work-tabs" role="tablist" aria-label="Select a project"></div>
      </div>
      <div class="header-actions">
        <button class="resume-btn" id="resume-btn" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="15" y2="17"/>
          </svg>
          <span>Resume</span>
        </button>
        <button class="contact-btn" id="contact-btn" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 6-10 7L2 6"/>
          </svg>
          <span>Contact</span>
        </button>
      </div>
    </header>

    <div class="work-panel" id="work-panel">
      <div class="work-image">
        <a id="work-image-link" target="_blank" rel="noopener">
          <img alt="">
        </a>
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
      </div>
      <div class="work-details">
        <a class="work-link" id="work-link" href="#" target="_blank" rel="noopener"></a>
        <ul class="work-highlights" id="work-highlights"></ul>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="resume-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resume-modal-title">
      <div class="modal-header">
        <h2 id="resume-modal-title">Resume</h2>
        <button class="modal-x" id="resume-close-x" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <iframe id="resume-frame" title="Benjamin Toth — Resume"></iframe>
      </div>
      <div class="modal-footer">
        <button class="modal-close-btn" id="resume-close-btn" type="button">Close</button>
        <a class="modal-download" id="resume-download" href="#">Download ↓</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="contact-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
      <div class="modal-header">
        <h2 id="contact-modal-title">Contact</h2>
        <button class="modal-x" id="contact-close-x" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <form class="contact-form" id="contact-form" action="https://formspree.io/f/xnpnqlkp" method="POST">
          <label class="contact-field">
            <span class="label-text">Your email</span>
            <input type="email" name="email" required>
          </label>
          <label class="contact-field">
            <span class="label-text">What can I help you with?</span>
            <textarea name="message" required></textarea>
          </label>
          <div class="cf-turnstile" data-sitekey="0x4AAAAAAE6yRIklu6xkH_JL"></div>
          <button class="contact-submit" id="contact-submit" type="submit">Send</button>
          <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button class="modal-close-btn" id="contact-close-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="../js/background.js"></script>
  <script src="../js/work.js"></script>
  <script src="../js/resume.js"></script>
  <script src="../js/contact.js"></script>
</body>
</html>
